name: CD

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ghcr.io/minah-bot/civicpulse-backend:${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ghcr.io/minah-bot/civicpulse-frontend:${{ github.sha }}

      - name: Set up kind
        uses: helm/kind-action@v1
        with:
          cluster_name: civicpulse

      - name: Install kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Set image tags
        working-directory: k8s/overlays/dev
        run: |
          kustomize edit set image ghcr.io/minah-bot/civicpulse-backend=ghcr.io/minah-bot/civicpulse-backend:${{ github.sha }}
          kustomize edit set image ghcr.io/minah-bot/civicpulse-frontend=ghcr.io/minah-bot/civicpulse-frontend:${{ github.sha }}

      - name: Deploy to ephemeral cluster
        run: kubectl apply -k k8s/overlays/dev

      - name: Wait for deployments
        run: |
          kubectl rollout status deployment/backend -n civicpulse --timeout=180s
          kubectl rollout status deployment/frontend -n civicpulse --timeout=180s

      - name: Debug deployment failure
        if: failure()
        run: |
          kubectl get pods -n civicpulse -o wide
          kubectl describe pods -n civicpulse
          kubectl logs deployment/backend -n civicpulse --tail=100 || true
          kubectl logs deployment/frontend -n civicpulse --tail=100 || true
          kubectl get events -n civicpulse --sort-by=.lastTimestamp

      - name: Smoke test backend health
        run: |
          kubectl port-forward -n civicpulse svc/backend 8000:8000 >/tmp/civicpulse-port-forward.log 2>&1 &
          sleep 5
          curl --fail http://127.0.0.1:8000/health

      - name: Show deployment status
        if: always()
        run: |
          kubectl get pods -n civicpulse
          kubectl get deployments -n civicpulse
