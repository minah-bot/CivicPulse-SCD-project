name: CD

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run backend tests
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pytest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ghcr.io/minah-bot/civicpulse-backend:${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ghcr.io/minah-bot/civicpulse-frontend:${{ github.sha }}

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up kind
        uses: helm/kind-action@v1
        with:
          cluster_name: civicpulse

      - name: Install kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Set image tags
        working-directory: k8s/overlays/dev
        run: |
          kustomize edit set image ghcr.io/minah-bot/civicpulse-backend=ghcr.io/minah-bot/civicpulse-backend:${{ github.sha }}
          kustomize edit set image ghcr.io/minah-bot/civicpulse-frontend=ghcr.io/minah-bot/civicpulse-frontend:${{ github.sha }}

      - name: Create GHCR pull secret
        run: |
          kubectl create namespace civicpulse --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret docker-registry ghcr-secret \
            --namespace=civicpulse \
            --docker-server=ghcr.io \
            --docker-username=${{ github.actor }} \
            --docker-password=${{ secrets.GITHUB_TOKEN }} \
            --docker-email=noreply@example.com \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy to ephemeral cluster
        run: kubectl apply -k k8s/overlays/dev

      - name: Wait for deployments
        run: |
          kubectl rollout status deployment/backend -n civicpulse --timeout=180s
          kubectl rollout status deployment/frontend -n civicpulse --timeout=180s

      - name: Debug deployment failure
        if: failure()
        run: |
          kubectl get pods -n civicpulse -o wide
          kubectl describe pods -n civicpulse
          kubectl logs deployment/backend -n civicpulse --tail=100 || true
          kubectl logs deployment/frontend -n civicpulse --tail=100 || true
          kubectl get events -n civicpulse --sort-by=.lastTimestamp

      - name: Smoke test backend health
        run: |
          kubectl port-forward -n civicpulse svc/backend 8000:8000 >/tmp/civicpulse-port-forward.log 2>&1 &
          sleep 5
          curl --fail http://127.0.0.1:8000/health

      - name: Show deployment status
        if: always()
        run: |
          kubectl get pods -n civicpulse
          kubectl get deployments -n civicpulse