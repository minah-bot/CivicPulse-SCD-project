apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
 
namespace: civicpulse
 
resources:
  - ../../base
 
# dev is for local/CI ephemeral-cluster testing -- fewer replicas, and
# the image tag here is overwritten by CI to the actual commit SHA being
# tested (see .github/workflows/cd.yml), never hardcoded to "latest".
replicas:
  - name: backend
    count: 1
  - name: frontend
    count: 1
 
images:
  - name: ghcr.io/minah-bot/civicpulse-backend
    newTag: dev-placeholder
  - name: ghcr.io/minah-bot/civicpulse-frontend
    newTag: dev-placeholder
 
patches:
  - target:
      kind: HorizontalPodAutoscaler
      name: backend-hpa
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 3
