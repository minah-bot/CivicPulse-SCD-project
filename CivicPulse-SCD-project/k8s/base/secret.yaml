# k8s/base/secret.yaml
#
# PLACEHOLDERS ONLY. This file is committed to git, so it must never
# contain a real password or API key -- real values are supplied at
# deploy time via `kubectl create secret` or your CI/CD secret store,
# which then overwrites/patches this object in the live cluster.
# See docs/RUNBOOK.md for exactly how real values get in.
 
apiVersion: v1
kind: Secret
metadata:
  name: civicpulse-secrets
  namespace: civicpulse
type: Opaque
stringData:
  POSTGRES_PASSWORD: "REPLACE_ME_AT_DEPLOY_TIME"
  GROQ_API_KEY: "REPLACE_ME_AT_DEPLOY_TIME"
